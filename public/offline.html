<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E4D3C" />
    <title>No connection — PayLink</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #F7F3EA;
        color: #11201A;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #fff;
                border-radius: 22px;
        padding: 32px 24px;
        text-align: center;
      }
      .logo { display: block; margin: 0 auto 16px; }
      h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 8px; }
      p { font-size: 14px; color: #4A5A52; margin: 0 0 24px; line-height: 1.5; }
      button {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 16px;
        box-shadow: inset 0 -3px 0 #08261D;
        background: #0E4D3C;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="logo" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0E4D3C"/><g transform="translate(10 10) scale(0.6875)"><path d="M12 30V21a9 9 0 0 1 9-9h9M52 34v9a9 9 0 0 1-9 9h-9" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="32" cy="32" r="7.5" fill="#EE9259"/></g></svg>
      <h1>You're offline</h1>
      <p>
        PayLink can't reach the internet right now. Check your signal or Wi-Fi,
        then try again. Nothing you've sent has been lost.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
